{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Історія ваших прогнозів</h2>
    <div class="table-responsive">
        <table class="table table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Дата</th>
                    <th>Деталі запиту та результат</th>
                </tr>
            </thead>
            <tbody>
                {% for item in history %}
                <tr>
                    <td>{{ item.created_at|date:"d.m.Y H:i" }}</td>
                    <td>{{ item.query }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center">Історія порожня.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a href="{% url 'home' %}" class="btn btn-primary">Повернутися до пошуку</a>
</div>
{% endblock %}
