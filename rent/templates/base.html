<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оренда</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h4>Сервіс Оренди</h4>
        <div>
            {% if user.is_authenticated %}
                <span class="me-3">Привіт, <strong>{{ user.username }}</strong>!</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-danger">Вийти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary">Увійти</a>
                <a href="{% url 'register' %}" class="btn btn-secondary">Реєстрація</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
